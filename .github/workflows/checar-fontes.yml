name: Checar fontes

on:
  workflow_dispatch:
  schedule:
    - cron: "23 12 * * 1"     # toda segunda 09:23 BRT
  push:
    paths:
      - "config/fontes.yaml"
      - "config/indicadores.yaml"

permissions:
  contents: write

concurrency:
  group: checar-fontes      # grupo próprio: na fila do relatório, um boletim pedido depois cancelava a checagem
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m agente validar-config
      - name: Testar todas as fontes
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python -m agente checar-fontes | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Salvar resultado
        run: |
          git config user.name "agro-intel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in relatorios/checagem_fontes.md data/checagem_fontes.json; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Checagem de fontes $(date +'%d/%m/%Y %H:%M')"
          for tentativa in 1 2 3 4; do            # outro workflow pode ter publicado ao mesmo tempo
            git pull --rebase -X theirs && git push && exit 0
            sleep $((tentativa * 15))
          done
          exit 1
