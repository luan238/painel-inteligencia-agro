name: Atualizar Boletim Agro (Tempo Real)

on:
  schedule:
    # Horários em UTC (3 horas à frente do horário de Brasília - BRT):
    - cron: '0 9 * * *'   # Roda todos os dias às 06:00 BRT (Morning Call)
    - cron: '0 15 * * *'  # Roda todos os dias às 12:00 BRT (Giro de Meio-Dia)
    - cron: '0 21 * * *'  # Roda todos os dias às 18:00 BRT (Fechamento)
  workflow_dispatch:      # Permite disparar manualmente com 1 clique na aba Actions do GitHub

permissions:
  contents: write         # Permite que o robô salve e crie novos arquivos no seu repositório

jobs:
  atualizar-mercado:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar biblioteca oficial do Gemini
        run: pip install google-genai

      - name: 4. Executar busca em tempo real e gerar JSON
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gerar_boletim.py

      - name: 5. Enviar boletim_atual.json e novo arquivo histórico para o GitHub
        run: |
          git config --global user.name "Agri-Intel Bot"
          git config --global user.email "bot@germinare.com"
          git add boletim_atual.json historico/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(intel): atualizacao automatica do boletim em tempo real" && git push)
