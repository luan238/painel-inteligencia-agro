name: Monitor de cotações

# Confere SÓ as cotações (sem notícias e sem IA, ~1–2 min). Se alguma cotação mudou,
# republica o boletim com os números novos e a última análise verificada — o painel
# aberto se atualiza sozinho em até 5 minutos. Se nada mudou, não publica nada.
on:
  # Disparado pelo "Plantão" (plantao.yml) a cada 20 min, das 09:07 às 19:47 (Brasília), seg–sex,
  # e pelo botão "Atualizar agora → rápido" do painel.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  livre:
    # não roda enquanto um boletim completo estiver sendo gerado
    runs-on: ubuntu-latest
    outputs:
      ocupado: ${{ steps.ver.outputs.ocupado }}
    steps:
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "${{ github.repository }}" --workflow relatorio.yml --limit 5 \
                --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting")] | length')
          if [ "${n:-0}" -gt 0 ]; then echo "ocupado=sim" >> "$GITHUB_OUTPUT"; else echo "ocupado=nao" >> "$GITHUB_OUTPUT"; fi

  monitorar:
    needs: livre
    if: needs.livre.outputs.ocupado == 'nao'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Conferir cotações
        id: mon
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python -m agente monitorar

      - name: Publicar se houver cotação nova
        id: pub
        if: steps.mon.outputs.mudou == 'sim'
        run: |
          BASE=$(git rev-parse HEAD)
          git config user.name "agro-intel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data relatorios boletim_atual.json; do
            if [ -e "$p" ]; then git add "$p"; fi     # pastas criadas pelo agente na 1ª execução
          done
          git commit -m "Cotações atualizadas $(date +'%d/%m %H:%M') BRT (monitor)"
          git fetch origin "${{ github.ref_name }}"
          if ! git diff --quiet "$BASE" FETCH_HEAD -- data/ultima_analise.json; then
            echo "Um boletim completo saiu enquanto o monitor rodava — esta atualização rápida foi descartada."
            echo "publicado=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git pull --rebase -X theirs origin "${{ github.ref_name }}"
          git push
          echo "publicado=sim" >> "$GITHUB_OUTPUT"

      - name: Atualizar o painel (GitHub Pages)
        if: steps.pub.outputs.publicado == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "/repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1 || echo "GitHub Pages não configurado (ok)"
