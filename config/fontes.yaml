# =============================================================================
#  FONTES CONFIÁVEIS — a "aba de fontes" do agente
# =============================================================================
#  Esta é a lista de sites que o agente pode usar. Ela aparece no painel na aba
#  "🌐 Fontes & Qualidade". Para adicionar um site:
#    • pelo painel: aba Fontes → "➕ Adicionar nova fonte" (abre um formulário
#      no GitHub e o robô inclui a fonte aqui automaticamente), ou
#    • editando este arquivo direto no GitHub (ícone de lápis) e copiando um
#      bloco abaixo.
#
#  Campos:
#    nome      → como aparece no painel
#    url       → página principal / de cotações
#    url_noticias (opcional) → página com a lista das últimas notícias
#    rss (opcional) → endereço do feed RSS; se vazio, o agente procura sozinho
#    regiao    → Brasil | Argentina | Internacional | China | Outra
#    tipo      → noticias | cotacoes | noticias_e_cotacoes | relatorio_oficial | api_oficial
#    idioma    → pt | es | en | zh
#    ativa     → true / false (false = fica na lista, mas o agente não usa)
#    prioridade→ 1 (mais confiável) a 3
#    observacao→ texto livre
# =============================================================================

