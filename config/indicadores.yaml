        tipo: tabela_html
        url: https://www.noticiasagricolas.com.br/cotacoes/petroleo
        titulo_contem: ["wti"]
        linha: 1
        coluna_valor: ["fechamento", "último", "ultimo", "cotação", "preço", "valor"]
        verificado: false
      - fonte: EIA (governo dos EUA)
        tipo: json_api
        url: "https://api.eia.gov/v2/petroleum/pri/spt/data/?api_key=${EIA_API_KEY}&frequency=daily&data[0]=value&facets[series][]=RWTC&sort[0][column]=period&sort[0][direction]=desc&length=30"
        caminho_lista: "response.data"
        campo_data: "period"
        campo_valor: "value"
        requer_env: EIA_API_KEY
        verificado: false
      - fonte: Yahoo Finance (checagem)
