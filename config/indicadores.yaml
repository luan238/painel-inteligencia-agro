# =============================================================================
#  INDICADORES (COTAÇÕES) — de onde vem cada número e como ele é conferido
# =============================================================================
#  A IA NUNCA gera estes números: eles são lidos destas fontes, conferidos e
#  gravados em data/historico.csv. Cada indicador pode ter várias fontes; a
#  de menor "prioridade" vence e as outras servem de checagem cruzada.
#
#  Checagens automáticas por indicador:
#    faixa                     → valor fora dela é REJEITADO (erro de unidade, de leitura etc.)
#    var_max_dia_pct           → variação maior gera ALERTA (3x maior = rejeitado)
#    defasagem_max_dias_uteis  → dado mais velho que isso vira "desatualizado"
#    divergencia_max_pct       → diferença entre fontes acima disso gera ALERTA
#
#  Tipos de fonte (coletores):
#    bcb_ptax      → API oficial PTAX do Banco Central
#    bcb_sgs       → API oficial de séries do BCB (ex.: 432 = Selic meta)
#    b3_ajustes    → página oficial "Ajustes do Pregão" da B3 (mercadoria + vencimento)
#    tabela_html   → lê uma tabela de uma página: escolhe a tabela pelo título,
#                    a linha pelo rótulo e a coluna pelo cabeçalho
#    regex_pagina  → captura um número no texto da página com uma expressão regular
#    json_api      → qualquer API JSON (aceita ${VARIAVEL} de ambiente na URL)
#    yahoo         → Yahoo Finance (fora da sua lista; desativado — só checagem cruzada)
#
#  "verificado: false" = configuração ainda não testada no site real. Rode a
#  ação "Checar fontes" no GitHub para confirmar.
# =============================================================================

indicadores:

  # ======================================================== CÂMBIO & ENERGIA
  - id: dolar_ptax
    nome: "Dólar PTAX (venda) — Banco Central"
    nome_curto: "Dólar PTAX (USD/BRL)"
    bloco: cambio_e_energia
    unidade: "R$"
    casas: 4
    faixa: [3.0, 10.0]
    var_max_dia_pct: 4
    defasagem_max_dias_uteis: 1
    fontes:
      - fonte: Banco Central do Brasil
        tipo: bcb_ptax
        verificado: true
      - fonte: Yahoo Finance (checagem)
        tipo: yahoo
        simbolo: "BRL=X"
        ativa: false
        verificado: false

