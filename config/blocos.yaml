# =============================================================================
#  BLOCOS DO RELATÓRIO (complexos), ELOS DA CADEIA E PAINÉIS
# =============================================================================
#  A ordem dos blocos é a ordem em que aparecem no painel e no relatório.
#  "id" = chave em market_indicators; "chave_resumo" = chave em executive_summary
#  (os nomes seguem exatamente o JSON que o index.html já lê).

blocos:
  - id: cambio_e_energia
    chave_resumo: cambio_energia_frete
    titulo: "🏛️🛢️ Cenário Político, Macro, Câmbio & Energia"
    elos:
      - "Elo: Produtores Rurais (Gestão de Custos, Insumos e Crédito)"
      - "Elo: Cooperativas e Revendas (Barter e Políticas de Crédito)"
      - "Elo: Indústrias, Usinas e Logística (Diesel, Frete e Energia)"
      - "Elo: Tradings e Mesa de Câmbio / Derivativos (FX & NDF)"
    palavras_chave: [dólar, dolar, câmbio, cambio, ptax, selic, copom, juros, inflação, ipca, fed, payroll,
      petróleo, petroleo, brent, wti, diesel, frete, fertilizante, ureia, potássio, crédito rural, plano safra,
      balança comercial, tarifa, tarifas, exportações do agro, dollar, exchange rate, crude, oil price,
      fertilizer, urea, potash, tariff, interest rate, tipo de cambio, retenciones, freight, 汇率, 化肥]

  - id: complexo_soja
    chave_resumo: complexo_soja
    titulo: "🌱 Complexo Soja e Derivados (Grão, Farelo e Óleo)"
    elos:
      - "Elo: Produtores Rurais (Comercialização e Hedge)"
      - "Elo: Cooperativas e Recebimento de Grãos"
      - "Elo: Indústrias Esmagadoras e Confinamentos (Farelo e Óleo)"
      - "Elo: Tradings e Visão do Trader (Basis, Spreads & CBOT)"
    palavras_chave: [soja, farelo, óleo de soja, oleo de soja, esmagamento, abiove, prêmio de exportação,
      biodiesel, soybean, soybeans, soymeal, soybean meal, soybean oil, crush, poroto, harina de soja,
      aceite de soja, 大豆, 豆粕, 豆油]

  - id: complexo_milho_e_ddgs
    chave_resumo: complexo_milho_etanol_ddgs
    titulo: "🌽🌾 Complexo Milho, Sorgo, Trigo e Coprodutos (Etanol e DDG/DDGS)"
    elos:
      - "Elo: Produtores de Milho, Sorgo e Trigo"
      - "Elo: Cooperativas e Sementeiras"
      - "Elo: Moinhos, Granjas (Frango, Ovos, Suínos) e Confinamentos"
      - "Elo: Tradings e Visão do Trader (B3 vs. CBOT)"
    palavras_chave: [milho, sorgo, ddg, ddgs, etanol de milho, trigo, cevada, frango, suíno, suino, ovos,
      safrinha, corn, maize, sorghum, wheat, ethanol, distillers, maíz, maiz, trigo, 玉米, 小麦, 高粱]

  - id: complexo_algodao
    chave_resumo: complexo_algodao
    titulo: "☁️ Complexo Algodão e Coprodutos (Pluma, Caroço e Farelo)"
    elos:
      - "Elo: Produtores Rurais (Cotonicultores)"
      - "Elo: Algodoeiras e Cooperativas"
      - "Elo: Indústrias e Confinamentos (Caroço e Farelo de Algodão)"
      - "Elo: Tradings e Visão do Trader (ICE NY & Câmbio)"
    palavras_chave: [algodão, algodao, pluma, caroço de algodão, abrapa, ampa, cotton, algodón, 棉花]

  - id: complexo_cafe
    chave_resumo: complexo_cafe
    titulo: "☕🐂 Complexo Café (Arábica & Robusta) e Pecuária"
    elos:
      - "Elo: Cafeicultores (Matas de Minas, Cerrado e Sul de Minas)"
      - "Elo: Cooperativas de Café e Exportadores"
      - "Elo: Pecuaristas e Confinamentos"
      - "Elo: Tradings, Frigoríficos e Trader (B3 Boi & ICE Café)"
    palavras_chave: [café, cafe, arábica, arabica, robusta, conilon, cooxupé, boi gordo, boi, arroba, bezerro,
      pecuária, pecuaria, carne bovina, frigorífico, confinamento, coffee, cattle, beef, ganado, novillo,
      hacienda, 咖啡, 牛肉]

# Ativos que aparecem nos cards do "Panorama Geral" e no gráfico semanal
painel_semanal: [dolar_ptax, petroleo_wti, soja_paranagua, soja_cbot, milho_campinas, trigo_parana,
  algodao_ice, cafe_arabica_cepea, boi_gordo_cepea]

# Ativos do gráfico mensal (daily_history)
painel_mensal: [dolar_ptax, petroleo_wti, soja_paranagua, soja_uberlandia, milho_campinas, trigo_parana,
  cafe_manhuacu, boi_gordo_cepea]

# Ativos da "Matriz de Projeções Auditáveis"
projecoes: [dolar_ptax, petroleo_wti, soja_paranagua, milho_campinas, trigo_parana, algodao_ice,
  cafe_arabica_cepea, boi_gordo_cepea]

# Spreads calculados pelo código (nunca pela IA). operacao: diferenca | razao
spreads:
  - id: spread_caroco_ba_mt
    nome: "Spread Caroço de Algodão BA − MT"
    bloco: complexo_algodao
    a: caroco_algodao_ba
    b: caroco_algodao_mt
    operacao: diferenca
    unidade: "R$/t"
    casas: 2
  - id: spread_soja_porto_uberlandia
    nome: "Diferencial Soja Paranaguá − Uberlândia"
    bloco: complexo_soja
    a: soja_paranagua
    b: soja_uberlandia
    operacao: diferenca
    unidade: "R$/sc"
    casas: 2
  - id: spread_milho_b3_calendario
    nome: "Spread Calendário Milho B3 (2º − 1º venc.)"
    bloco: complexo_milho_e_ddgs
    a: milho_b3_2
    b: milho_b3
    operacao: diferenca
    unidade: "R$/sc"
    casas: 2
  - id: spread_cafe_cepea_manhuacu
    nome: "Diferencial Café Cepea − Manhuaçu"
    bloco: complexo_cafe
    a: cafe_arabica_cepea
    b: cafe_manhuacu
    operacao: diferenca
    unidade: "R$/sc"
    casas: 2
